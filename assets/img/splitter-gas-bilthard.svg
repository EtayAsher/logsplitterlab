<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-hidden="true">
  <defs>
    <style>
      .bg{fill:#f5f0e8;}
      .frame{fill:none;stroke:#1a3a2a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;}
      .accent{fill:#2f5f8a;}
      .accent-line{fill:none;stroke:#2f5f8a;stroke-width:5;stroke-linecap:round;}
      .wood{fill:#efe8da;stroke:#8B4513;stroke-width:3;}
      .wheel{fill:#1a3a2a;}
      .wheel-hub{fill:#f5f0e8;}
      .badge{fill:#2f5f8a;}
      .badge-text{fill:#fdfaf4;font-family:Georgia,serif;font-size:12px;font-weight:700;}
    </style>
  </defs>
  <rect class="bg" width="320" height="220" rx="12"/>

  <!-- ground line -->
  <line x1="24" y1="176" x2="296" y2="176" stroke="#e0d8c8" stroke-width="3"/>

  <!-- mid-length frame: shorter than the 32-ton full-beam model, longer than the
       20-ton portable pair — a genuinely distinct proportion for a genuinely
       distinct (27-ton, towable, horizontal/vertical) machine -->
  <rect class="frame" x="62" y="118" width="182" height="22" rx="4"/>

  <!-- engine block (gas) -->
  <rect class="frame" x="48" y="86" width="46" height="46" rx="6"/>
  <circle class="accent" cx="71" cy="109" r="10"/>
  <path class="accent-line" d="M94 96 q16 -6 16 -22"/>

  <!-- wedge with vertical-hinge pivot mark, signaling horizontal/vertical capability -->
  <path class="frame" d="M228 108 L258 129 L228 150 Z"/>
  <circle class="accent" cx="228" cy="129" r="5"/>

  <!-- log -->
  <circle class="wood" cx="168" cy="129" r="26"/>
  <circle class="wood" cx="168" cy="129" r="11" fill="none" stroke="#8B4513" stroke-width="2"/>

  <!-- DOT-rated transport wheels + ball-coupler tow hitch (confirmed towable hardware) -->
  <circle class="wheel" cx="98" cy="168" r="16"/>
  <circle class="wheel-hub" cx="98" cy="168" r="5"/>
  <circle class="wheel" cx="212" cy="168" r="16"/>
  <circle class="wheel-hub" cx="212" cy="168" r="5"/>
  <path class="accent-line" d="M62 140 q-20 -4 -20 20" fill="none"/>
  <circle class="accent" cx="40" cy="162" r="6"/>

  <!-- brand badge (decorative, generic icon — not a photo of the real product) -->
  <rect class="badge" x="20" y="20" width="110" height="26" rx="13"/>
  <text class="badge-text" x="75" y="38" text-anchor="middle">BILT HARD</text>
</svg>
