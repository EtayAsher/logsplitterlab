<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-hidden="true">
  <defs>
    <style>
      .bg{fill:#f5f0e8;}
      .frame{fill:none;stroke:#1a3a2a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;}
      .accent{fill:#a6321b;}
      .accent-line{fill:none;stroke:#a6321b;stroke-width:5;stroke-linecap:round;}
      .wood{fill:#efe8da;stroke:#8B4513;stroke-width:3;}
      .wheel{fill:#1a3a2a;}
      .wheel-hub{fill:#f5f0e8;}
      .badge{fill:#a6321b;}
      .badge-text{fill:#fdfaf4;font-family:Georgia,serif;font-size:13px;font-weight:700;}
    </style>
  </defs>
  <rect class="bg" width="320" height="220" rx="12"/>

  <!-- ground line -->
  <line x1="24" y1="176" x2="296" y2="176" stroke="#e0d8c8" stroke-width="3"/>

  <!-- longer full-beam frame -->
  <rect class="frame" x="48" y="118" width="212" height="22" rx="4"/>

  <!-- engine block (gas) -->
  <rect class="frame" x="34" y="86" width="46" height="46" rx="6"/>
  <circle class="accent" cx="57" cy="109" r="10"/>
  <path class="accent-line" d="M80 96 q16 -6 16 -22"/>

  <!-- wedge -->
  <path class="frame" d="M244 108 L274 129 L244 150 Z"/>

  <!-- log -->
  <circle class="wood" cx="188" cy="129" r="26"/>
  <circle class="wood" cx="188" cy="129" r="11" fill="none" stroke="#8B4513" stroke-width="2"/>

  <!-- wheels, spaced wider for a bigger towable frame -->
  <circle class="wheel" cx="90" cy="168" r="17"/>
  <circle class="wheel-hub" cx="90" cy="168" r="5.5"/>
  <circle class="wheel" cx="222" cy="168" r="17"/>
  <circle class="wheel-hub" cx="222" cy="168" r="5.5"/>

  <!-- tow hitch (confirmed road-towable model) -->
  <path class="accent-line" d="M48 140 q-22 -4 -22 20" fill="none"/>
  <circle class="accent" cx="24" cy="163" r="6"/>

  <!-- brand badge (decorative, generic icon — not a photo of the real product) -->
  <rect class="badge" x="20" y="20" width="98" height="26" rx="13"/>
  <text class="badge-text" x="69" y="38" text-anchor="middle">CHAMPION</text>
</svg>
