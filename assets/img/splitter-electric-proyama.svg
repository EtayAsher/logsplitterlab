<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-hidden="true">
  <defs>
    <style>
      .bg{fill:#f5f0e8;}
      .frame{fill:none;stroke:#1a3a2a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;}
      .accent{fill:#8a7325;}
      .accent-line{fill:none;stroke:#8a7325;stroke-width:5;stroke-linecap:round;}
      .wood{fill:#efe8da;stroke:#8B4513;stroke-width:3;}
      .wheel{fill:#1a3a2a;}
      .wheel-hub{fill:#f5f0e8;}
      .badge{fill:#8a7325;}
      .badge-text{fill:#fdfaf4;font-family:Georgia,serif;font-size:12px;font-weight:700;}
    </style>
  </defs>
  <rect class="bg" width="320" height="220" rx="12"/>
  <line x1="24" y1="176" x2="296" y2="176" stroke="#e0d8c8" stroke-width="3"/>

  <!-- flush base -->
  <rect class="frame" x="66" y="150" width="180" height="20" rx="4"/>

  <!-- motor housing (electric) -->
  <path class="frame" d="M52 164 V136 a20 20 0 0 1 20 -20 h0 a20 20 0 0 1 20 20 v28 Z"/>
  <path class="accent-line" d="M52 145 q-17 6 -17 25" fill="none"/>
  <rect class="accent" x="24" y="168" width="15" height="10" rx="2"/>

  <!-- CROSS WEDGE: a 4-way "+" wedge tip, distinct from every other product's
       single triangular wedge — reflects the manufacturer-stated feature
       that splits one log into four pieces per stroke -->
  <g transform="translate(228,160)">
    <path class="frame" d="M0 -20 L22 0 L0 20 L-22 0 Z"/>
    <line class="accent-line" x1="0" y1="-14" x2="0" y2="14" stroke-width="3"/>
    <line class="accent-line" x1="-14" y1="0" x2="14" y2="0" stroke-width="3"/>
  </g>

  <!-- log, pre-split, positioned at the cross wedge -->
  <circle class="wood" cx="172" cy="160" r="22"/>
  <circle class="wood" cx="172" cy="160" r="9" fill="none" stroke="#8B4513" stroke-width="2"/>

  <!-- wheels -->
  <circle class="wheel" cx="92" cy="176" r="9"/>
  <circle class="wheel-hub" cx="92" cy="176" r="3.2"/>
  <circle class="wheel" cx="222" cy="176" r="9"/>
  <circle class="wheel-hub" cx="222" cy="176" r="3.2"/>

  <rect class="badge" x="20" y="20" width="110" height="26" rx="13"/>
  <text class="badge-text" x="75" y="38" text-anchor="middle">PROYAMA</text>
</svg>
