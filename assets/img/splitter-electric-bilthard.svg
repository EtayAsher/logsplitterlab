<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-hidden="true">
  <defs>
    <style>
      .bg{fill:#f5f0e8;}
      .frame{fill:none;stroke:#1a3a2a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;}
      .accent{fill:#3b6e91;}
      .accent-line{fill:none;stroke:#3b6e91;stroke-width:5;stroke-linecap:round;}
      .wood{fill:#efe8da;stroke:#8B4513;stroke-width:3;}
      .wheel{fill:#1a3a2a;}
      .wheel-hub{fill:#f5f0e8;}
      .base{fill:#e6ded0;stroke:#1a3a2a;stroke-width:4;}
      .badge{fill:#3b6e91;}
      .badge-text{fill:#fdfaf4;font-family:Georgia,serif;font-size:13px;font-weight:700;}
    </style>
  </defs>
  <rect class="bg" width="320" height="220" rx="12"/>

  <!-- ground line -->
  <line x1="24" y1="176" x2="296" y2="176" stroke="#e0d8c8" stroke-width="3"/>

  <!-- flat base plate instead of thin legs -->
  <rect class="base" x="72" y="158" width="176" height="14" rx="4"/>

  <!-- beam -->
  <rect class="frame" x="70" y="118" width="180" height="22" rx="4"/>

  <!-- motor housing (electric, rounded top) -->
  <path class="frame" d="M56 132 V104 a21 21 0 0 1 21 -21 h0 a21 21 0 0 1 21 21 v28 Z"/>
  <!-- plug + cord -->
  <path class="accent-line" d="M56 113 q-18 6 -18 26" fill="none"/>
  <rect class="accent" x="26" y="137" width="16" height="10" rx="2"/>

  <!-- wedge -->
  <path class="frame" d="M228 108 L258 129 L228 150 Z"/>

  <!-- log -->
  <circle class="wood" cx="176" cy="129" r="24"/>
  <circle class="wood" cx="176" cy="129" r="10" fill="none" stroke="#8B4513" stroke-width="2"/>

  <!-- wheels set into the base plate -->
  <circle class="wheel" cx="98" cy="172" r="10"/>
  <circle class="wheel-hub" cx="98" cy="172" r="3.5"/>
  <circle class="wheel" cx="222" cy="172" r="10"/>
  <circle class="wheel-hub" cx="222" cy="172" r="3.5"/>

  <!-- brand badge (decorative, generic icon — not a photo of the real product) -->
  <rect class="badge" x="20" y="20" width="98" height="26" rx="13"/>
  <text class="badge-text" x="69" y="38" text-anchor="middle">BILT HARD</text>
</svg>
