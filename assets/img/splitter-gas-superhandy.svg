<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-hidden="true">
  <defs>
    <style>
      .bg{fill:#f5f0e8;}
      .frame{fill:none;stroke:#1a3a2a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;}
      .accent{fill:#2d7a63;}
      .accent-line{fill:none;stroke:#2d7a63;stroke-width:5;stroke-linecap:round;}
      .wood{fill:#efe8da;stroke:#8B4513;stroke-width:3;}
      .wheel{fill:#1a3a2a;}
      .wheel-hub{fill:#f5f0e8;}
      .badge{fill:#2d7a63;}
      .badge-text{fill:#fdfaf4;font-family:Georgia,serif;font-size:12px;font-weight:700;}
    </style>
  </defs>
  <rect class="bg" width="320" height="220" rx="12"/>

  <!-- ground line -->
  <line x1="24" y1="176" x2="296" y2="176" stroke="#e0d8c8" stroke-width="3"/>

  <!-- shorter half-beam frame (distinct from the full-beam gas model) -->
  <rect class="frame" x="82" y="118" width="146" height="22" rx="4"/>

  <!-- engine block (gas) -->
  <rect class="frame" x="68" y="86" width="46" height="46" rx="6"/>
  <circle class="accent" cx="91" cy="109" r="10"/>
  <path class="accent-line" d="M114 96 q16 -6 16 -22"/>

  <!-- wedge with vertical-hinge pivot mark, signaling horizontal/vertical capability -->
  <path class="frame" d="M228 108 L258 129 L228 150 Z"/>
  <circle class="accent" cx="228" cy="129" r="5"/>

  <!-- larger log (largest diameter rating in the catalog) -->
  <circle class="wood" cx="178" cy="129" r="28"/>
  <circle class="wood" cx="178" cy="129" r="12" fill="none" stroke="#8B4513" stroke-width="2"/>

  <!-- compact wheels + folding handle, no tow hitch (no confirmed road-tow rating) -->
  <circle class="wheel" cx="106" cy="168" r="14"/>
  <circle class="wheel-hub" cx="106" cy="168" r="4.5"/>
  <circle class="wheel" cx="204" cy="168" r="14"/>
  <circle class="wheel-hub" cx="204" cy="168" r="4.5"/>
  <path class="accent-line" d="M228 140 q26 2 30 -18" fill="none"/>

  <!-- brand badge (decorative, generic icon — not a photo of the real product) -->
  <rect class="badge" x="20" y="20" width="130" height="26" rx="13"/>
  <text class="badge-text" x="85" y="38" text-anchor="middle">SUPERHANDY</text>
</svg>
