<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-hidden="true">
  <defs>
    <style>
      .bg{fill:#f5f0e8;}
      .frame{fill:none;stroke:#1a3a2a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;}
      .accent{fill:#5c8a6a;}
      .accent-line{fill:none;stroke:#5c8a6a;stroke-width:5;stroke-linecap:round;}
      .wood{fill:#efe8da;stroke:#8B4513;stroke-width:3;}
      .wheel{fill:#1a3a2a;}
      .wheel-hub{fill:#f5f0e8;}
      .badge{fill:#5c8a6a;}
      .badge-text{fill:#fdfaf4;font-family:Georgia,serif;font-size:12px;font-weight:700;}
    </style>
  </defs>
  <rect class="bg" width="320" height="220" rx="12"/>
  <line x1="24" y1="176" x2="296" y2="176" stroke="#e0d8c8" stroke-width="3"/>

  <!-- longer beam — highest log capacity of the electric models in the
       catalog (14T, 16in diameter / 20in length) -->
  <rect class="frame" x="58" y="150" width="204" height="20" rx="4"/>

  <!-- motor housing (electric) -->
  <path class="frame" d="M44 164 V136 a20 20 0 0 1 20 -20 h0 a20 20 0 0 1 20 20 v28 Z"/>
  <path class="accent-line" d="M44 145 q-16 6 -16 25" fill="none"/>
  <rect class="accent" x="16" y="168" width="14" height="9" rx="2"/>

  <!-- wedge -->
  <path class="frame" d="M234 136 L262 160 L234 184 Z"/>

  <!-- larger log — largest diameter rating among the catalog's electric models -->
  <circle class="wood" cx="180" cy="160" r="26"/>
  <circle class="wood" cx="180" cy="160" r="11" fill="none" stroke="#8B4513" stroke-width="2"/>

  <!-- integrated handle + wheels -->
  <path class="accent-line" d="M238 150 q24 -4 24 22" fill="none"/>
  <circle class="wheel" cx="90" cy="178" r="11"/>
  <circle class="wheel-hub" cx="90" cy="178" r="4"/>
  <circle class="wheel" cx="218" cy="178" r="11"/>
  <circle class="wheel-hub" cx="218" cy="178" r="4"/>

  <rect class="badge" x="20" y="20" width="130" height="26" rx="13"/>
  <text class="badge-text" x="85" y="38" text-anchor="middle">SUPERHANDY</text>
</svg>
