<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-hidden="true">
  <defs>
    <style>
      .bg{fill:#f5f0e8;}
      .frame{fill:none;stroke:#1a3a2a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;}
      .accent{fill:#6b4c8a;}
      .accent-line{fill:none;stroke:#6b4c8a;stroke-width:5;stroke-linecap:round;}
      .wood{fill:#efe8da;stroke:#8B4513;stroke-width:3;}
      .wheel{fill:#1a3a2a;}
      .wheel-hub{fill:#f5f0e8;}
      .badge{fill:#6b4c8a;}
      .badge-text{fill:#fdfaf4;font-family:Georgia,serif;font-size:12px;font-weight:700;}
    </style>
  </defs>
  <rect class="bg" width="320" height="220" rx="12"/>

  <!-- ground line -->
  <line x1="24" y1="176" x2="296" y2="176" stroke="#e0d8c8" stroke-width="3"/>

  <!-- longer beam (higher-tonnage electric) -->
  <rect class="frame" x="60" y="118" width="196" height="22" rx="4"/>

  <!-- larger boxy motor housing (higher HP electric) -->
  <rect class="frame" x="42" y="88" width="52" height="44" rx="8"/>
  <circle class="accent" cx="68" cy="110" r="8"/>
  <!-- plug + cord -->
  <path class="accent-line" d="M42 118 q-18 6 -18 26" fill="none"/>
  <rect class="accent" x="12" y="141" width="16" height="10" rx="2"/>

  <!-- wedge -->
  <path class="frame" d="M234 108 L264 129 L234 150 Z"/>

  <!-- larger log (bigger diameter capacity) -->
  <circle class="wood" cx="180" cy="129" r="28"/>
  <circle class="wood" cx="180" cy="129" r="12" fill="none" stroke="#8B4513" stroke-width="2"/>

  <!-- sturdy wheels, no stand legs (ground-level unit) -->
  <circle class="wheel" cx="94" cy="168" r="16"/>
  <circle class="wheel-hub" cx="94" cy="168" r="5"/>
  <circle class="wheel" cx="222" cy="168" r="16"/>
  <circle class="wheel-hub" cx="222" cy="168" r="5"/>

  <!-- brand badge (decorative, generic icon — not a photo of the real product) -->
  <rect class="badge" x="20" y="20" width="130" height="26" rx="13"/>
  <text class="badge-text" x="85" y="38" text-anchor="middle">SUPERHANDY</text>
</svg>
